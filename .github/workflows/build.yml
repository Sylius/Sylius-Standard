name: Build

on:
    pull_request:
        paths-ignore:
            - "adr/**"
            - "docs/**"
            - "*.md"
    workflow_dispatch: ~
    push:
        branches-ignore:
            - 'dependabot/**'
            - 'upmerge/**'

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}-minimal
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    static-checks:
        name: Static checks
        uses: ./.github/workflows/ci_static-checks.yaml
        with:
            type: minimal
    
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: sylius_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/sylius_test?charset=utf8mb4&serverVersion=8.0"
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, gd, opcache, mysql, pdo_mysql
                  tools: composer

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Wait for MySQL
              run: |
                  until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
                      echo "Waiting for MySQL..."
                      sleep 2
                  done

            - name: Run database migrations
              run: bin/console doctrine:migrations:migrate --no-interaction --env=test || true

            - name: Run all PHPUnit tests
              run: vendor/bin/phpunit --colors=always
    
    e2e-mysql:
        name: End-to-end tests (MySQL)
        uses: ./.github/workflows/ci_e2e-mysql.yaml
        with:
            type: minimal
