#cloud-config
#
# QA Companion pilot -- user data for a fresh Ubuntu 24.04 host (pilot step P.2).
#
# Paste this into the provider's "cloud config" / user-data field when creating the server.
# It does nothing itself: everything is in etc/pilot/bootstrap.sh, so that a host created
# without this user data -- which cannot be added afterwards -- is fixed by running the same
# script by hand, and there is one description of what a pilot host is rather than two that
# drift.
#
# `cloud-init status --wait` says when this has finished; it takes a couple of minutes, and a
# deploy started before it ends will fail on a missing docker.
package_update: true

packages:
  - curl

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/qacompanion/Sylius-Standard/pilot/etc/pilot/bootstrap.sh -o /root/bootstrap.sh
  - bash /root/bootstrap.sh
