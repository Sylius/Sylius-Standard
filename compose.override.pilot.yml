# QA Companion pilot deployment overlay.
#
# Copy this to compose.override.yml before running `make init` / `make up`:
#
#     cp compose.override.pilot.yml compose.override.yml
#
# It is compose.override.dist.yml (upstream's developer template) with exactly two
# pilot-specific changes -- keep it in sync by re-diffing against that file after an
# upstream upgrade:
#
#   1. nginx publishes 8080 instead of 80, because the QA Companion platform stack
#      already owns port 80 on the dev host.
#   2. SYLIUS_FIXTURES_HOSTNAME sets the hostname the shop channel answers on, which is
#      also the host part of the base URL the platform stores for this environment.
#
# The platform reaches this stack purely as a URL, exactly as it would reach a real
# customer's staging environment: no shared Docker network, no entries in the platform's
# compose file. Adding this environment is a configuration change only. On a real host,
# set SYLIUS_FIXTURES_HOSTNAME to that host's DNS name.
services:
    php:
        image: ghcr.io/sylius/sylius-php:8.3-fixuid-xdebug-alpine
        user: ${DOCKER_USER:-1000:1000}
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            # You can move these environment variables to your .env.local file
            APP_ENV: ${APP_ENV:-dev}
            APP_SECRET: EDITME
            # Pilot: hostname the shop channel answers on, and therefore the host part of
            # the base URL the platform stores for this environment. Deliberately a name
            # Docker resolves in every container with no platform-side configuration, so
            # adding this environment is a config change only. On a real host this becomes
            # that host's DNS name, exactly as a customer's staging domain would.
            SYLIUS_FIXTURES_HOSTNAME: ${SYLIUS_FIXTURES_HOSTNAME:-host.docker.internal}
            DATABASE_URL: "mysql://root@mysql/sylius_%kernel.environment%"
            MAILER_DSN: smtp://mailhog:1025
            MESSENGER_TRANSPORT_DSN: doctrine://default
            SYLIUS_MESSENGER_TRANSPORT_MAIN_DSN: doctrine://default
            SYLIUS_MESSENGER_TRANSPORT_MAIN_FAILED_DSN: doctrine://default?queue_name=main_failed
            SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_DSN: doctrine://default?queue_name=catalog_promotion_removal
            SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_FAILED_DSN: doctrine://default?queue_name=catalog_promotion_removal_failed
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_DSN: sync://
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_FAILED_DSN: sync://
            PHP_DATE_TIMEZONE: ${PHP_DATE_TIMEZONE:-UTC}
            XDEBUG_MODE: debug
            XDEBUG_CONFIG: >-
                client_host=host.docker.internal
                client_port=9003
                log=/dev/stdout
            # This should correspond to the server declared in PHPStorm `Preferences | Languages & Frameworks | PHP | Servers`
            # Then PHPStorm will use the corresponding path mappings
            PHP_IDE_CONFIG: serverName=sylius
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
          - .:/srv/sylius:rw,cached
          # if you develop on Linux, you may use a bind-mounted host directory instead
#          - ./var:/srv/sylius/var:rw
          - ./public:/srv/sylius/public:rw,delegated
          # if you develop on Linux, you may use a bind-mounted host directory instead
#          - ./public/media:/srv/sylius/public/media:rw
          - public-media:/srv/sylius/public/media:rw
    mysql:
        volumes:
            - mysql-data:/var/lib/mysql:rw
        ports:
            - "3306:3306"
    nginx:
        depends_on:
            php:
                condition: service_started
        volumes:
            - ./public:/srv/sylius/public:ro
            # if you develop on Linux, you may use a bind-mounted host directory instead
#            - ./public/media:/srv/sylius/public/media:ro
            - public-media:/srv/sylius/public/media:ro,nocopy
        ports:
            - "8080:80"
    nodejs:
        image: node:${NODE_VERSION:-22}-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius
        entrypoint: [ "/bin/sh","-c" ]
        command:
            - |
                yarn install
                yarn build
        volumes:
            - .:/srv/sylius:rw,cached
            - ./public:/srv/sylius/public:rw,delegated
    # Upstream's service is MailHog, which is unmaintained and exposes no usable API for
    # asserting on captured mail. Mailpit is a drop-in on the same ports (SMTP 1025, UI
    # 8025) and serves a REST API at /api/v1, so the service keeps its name -- and the php
    # service's MAILER_DSN (smtp://mailhog:1025) -- while actually running Mailpit.
    mailhog:
        image: axllent/mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
            - "8025:8025"

volumes:
    mysql-data:
    public-media:
