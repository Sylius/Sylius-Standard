# QA Companion pilot provisioning suite.
#
# Sylius exposes no granular "create a customer / create a product" console commands, so
# the supported provisioning surface is a named fixture suite loaded with:
#
#     bin/console sylius:fixtures:load qa_pilot -n
#
# This suite deliberately declares NO listeners. The built-in `default` suite registers
# `orm_purger`, which truncates the database before loading; omitting it makes this suite
# ADDITIVE, so a world can be provisioned on top of the demo catalogue instead of
# replacing it. That property is what makes fixtures usable as a provisioning mechanism
# rather than only as a first-run seed.
#
# Reloading this suite twice is not idempotent: shop_user and product fixtures fail on
# duplicate email/code. Re-provisioning therefore means reset-then-load -- the commands are
# in etc/pilot/README.md, and the timings behind the choice are in the QA Companion
# roadmap's "P.3 findings".
sylius_fixtures:
    suites:
        # Override of the built-in demo suite, not a pilot suite of our own.
        #
        # `default` generates 20 shop users with no explicit customer_group, and that option
        # defaults to LazyOption::randomOneOrNull() -- a random pick from whatever groups
        # exist. Their groups therefore shuffled on every load (one run: 6 retail / 15
        # wholesale), and any group ever created before them could be assigned by chance.
        # Pinning the prototype makes the demo population deterministic and keeps `vip` and
        # `standard` reserved for the pilot customers declared below.
        default:
            fixtures:
                shop_user:
                    options:
                        prototype:
                            customer_group: 'retail'

        qa_pilot:
            fixtures:
                qa_pilot_customer_group:
                    name: customer_group
                    options:
                        custom:
                            vip:
                                code: 'vip'
                                name: 'VIP'
                            standard:
                                code: 'standard'
                                name: 'Standard'

                # customer_group MUST be set explicitly on every user. Its factory default
                # is LazyOption::randomOneOrNull(), so an omitted group is not "no group" --
                # it is a RANDOM existing group, which silently produces a non-deterministic
                # world (it first put the standard customer in VIP).
                qa_pilot_shop_user:
                    name: shop_user
                    options:
                        custom:
                            -   email: 'vip@pilot.test'
                                first_name: 'Vera'
                                last_name: 'Ives'
                                password: 'pilot123'
                                customer_group: 'vip'
                            -   email: 'standard@pilot.test'
                                first_name: 'Sam'
                                last_name: 'Tandard'
                                password: 'pilot123'
                                customer_group: 'standard'

                qa_pilot_product:
                    name: product
                    options:
                        custom:
                            -   name: 'Pilot Reference Mug'
                                code: 'PILOT_MUG'
                                slug: 'pilot-reference-mug'
                                channels:
                                    - 'FASHION_WEB'

                # Sylius's product fixture cannot set a price -- ProductExampleFactory
                # hardcodes a random one -- so pin it here (App\Fixture\ChannelPricingFixture).
                # Must come after qa_pilot_product, which creates the variant it prices.
                qa_pilot_channel_pricing:
                    name: channel_pricing
                    options:
                        prices:
                            -   product: 'PILOT_MUG'
                                channel: 'FASHION_WEB'
                                price: 2500
                            # Pinned too, so no channel of the world carries a random price.
                            -   product: 'PILOT_MUG'
                                channel: 'WEB_EUR'
                                price: 2200

                # The pilot's demo domain: "a VIP customer gets a promotion price, a standard
                # customer pays list price", expressed in native Sylius concepts -- a cart
                # promotion whose rule matches the customer's group.
                #
                # `percentage` is given here in PERCENT UNITS: write 10 for 10%.
                # PromotionActionExampleFactory divides it by 100 before persisting, and
                # PercentageDiscountPromotionActionCommand then asserts the stored value is
                # <= 1. Writing 0.1 here looks correct but silently stores 0.001 (0.1%),
                # producing a discount of zero after rounding rather than an error.
                qa_pilot_promotion:
                    name: promotion
                    options:
                        custom:
                            vip_discount:
                                code: 'vip_discount'
                                name: 'VIP discount'
                                channels:
                                    - 'FASHION_WEB'
                                rules:
                                    -   type: 'customer_group'
                                        configuration:
                                            group_code: 'vip'
                                actions:
                                    -   type: 'order_percentage_discount'
                                        configuration:
                                            percentage: 10

                # Why the VIP customer is a VIP: a purchase history.
                #
                # Added because the platform's world validation caught the world claiming
                # `vip_customer.purchase_count equals 2` against a shop where that customer had
                # never bought anything. The world's claim is the sensible one -- VIP status
                # follows from buying -- so the shop is what changed.
                #
                # Sylius's own `order` fixture is used rather than a custom one: it resolves
                # `customer` by email and drives the real checkout state machine, so these are
                # completed orders in the way the rest of the shop understands, not rows that
                # merely look like them. It must come after the fixtures that create the
                # customer and the products the orders are built from.
                qa_pilot_vip_orders:
                    name: order
                    options:
                        amount: 2
                        channel: 'FASHION_WEB'
                        customer: 'vip@pilot.test'
                        fulfilled: true
